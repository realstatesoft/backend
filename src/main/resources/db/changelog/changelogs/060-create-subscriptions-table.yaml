databaseChangeLog:
  - changeSet:
      id: 060-create-subscriptions-table
      author: tania
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: subscription_plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: starts_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: user_id
            constraintName: fk_subscriptions_user
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: subscription_plan_id
            constraintName: fk_subscriptions_plan
            referencedTableName: subscription_plans
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: payment_id
            constraintName: fk_subscriptions_payment
            referencedTableName: payments
            referencedColumnNames: id
        - createIndex:
            tableName: subscriptions
            indexName: idx_subscriptions_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: subscriptions
            indexName: idx_subscriptions_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: subscriptions
            indexName: idx_subscriptions_expires_at
            columns:
              - column:
                  name: expires_at
