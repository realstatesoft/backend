# ============================================================
# application-prod.yml — Perfil PRODUCCIÓN
# Activar con: SPRING_PROFILES_ACTIVE=prod
# Todos los valores sensibles vienen de variables de entorno.
# ============================================================

# Render inyecta PORT; Spring Boot la lee aquí como server.port
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Liquibase igual habilitado — migraciones automáticas al arrancar
  liquibase:
    enabled: true

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

# ── JWT ──
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000        # 24 horas
      refresh-expiration: 604800000 # 7 días

# ── Supabase ──
supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:openroof-images}

# ── Upload ──
upload:
  max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
  allowed-types: ${UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp}

# ── CORS (producción) — solo dominios exactos, sin wildcard ──
# CORS_ALLOWED_ORIGINS: dominios productivos oficiales (comma-separated).
# CORS_ALLOWED_PREVIEW_ORIGINS: previews aprobados explícitamente (comma-separated).
# Ejemplo:
# CORS_ALLOWED_ORIGINS=https://app.openroof.com,https://www.openroof.com
# CORS_ALLOWED_PREVIEW_ORIGINS=https://openroof-qa.vercel.app,https://openroof-staging.vercel.app
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.openroof.com}
  allowed-preview-origins: ${CORS_ALLOWED_PREVIEW_ORIGINS:}

# ── Security headers (CSP para respuestas JSON/PDF de la API) ──
security:
  headers:
    csp-enabled: true

# ── Auth rate limiting (valores estrictos para producción) ──
# Ajustar via variables de entorno si es necesario.
auth:
  rate-limit:
    login:
      max-per-ip: ${AUTH_RATE_LIMIT_LOGIN_MAX_IP:10}
      max-per-email: ${AUTH_RATE_LIMIT_LOGIN_MAX_EMAIL:5}
      window-minutes: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:15}
    register:
      max-per-ip: ${AUTH_RATE_LIMIT_REGISTER_MAX_IP:5}
      window-minutes: ${AUTH_RATE_LIMIT_REGISTER_WINDOW:60}
    refresh:
      max-per-ip: ${AUTH_RATE_LIMIT_REFRESH_MAX_IP:20}
      window-minutes: ${AUTH_RATE_LIMIT_REFRESH_WINDOW:15}

# ── Logging reducido en producción ──
logging:
  level:
    root: WARN
    com.openroof: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# ── Swagger deshabilitado en producción para ahorrar memoria ──
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
